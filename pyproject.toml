[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retina-iae"
version = "0.1.0"
description = "Material do Módulo 04 (IA Embarcada) — Retina em Foco, IFPE Campus Palmares"
requires-python = ">=3.10"
dependencies = [
    "retina-pdi @ git+https://github.com/tiagopessoalima/pdib.git@70d02c46d345eecb2313ebc6a6051ec33ac58aab",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
# treino e conversão no PC (o Raspberry Pi só precisa de "pi")
treino = ["tensorflow>=2.20,<2.22", "safetensors>=0.4", "huggingface_hub>=0.23", "ai-edge-litert>=2.0"]
pi = ["ai-edge-litert>=2.0", "psutil>=5.9"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
